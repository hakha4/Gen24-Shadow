# =============================================================================
# ps_02_battery_hub.yaml  —  sensor.gen24_battery_hub
# =============================================================================
# Central batteridomän-sensor. Samlar ALL information om batteriet på EN plats:
# kapacitet, energi, effektflöden, min-SoC-hierarki, SoC-mål, lås och status.
#
# State = SoC (%) — den viktigaste batteriparametern.
# Alla powerflöden: W (positiv = laddar, negativ = urladdar).
# Alla energivärden: kWh.
# Alla SoC-nivåer: % (0–100).
#
# READ-ONLY: ändrar ingenting i systemet. Additiv.
# Uppdateras automatiskt när SoC, batteriflöde eller policy ändras.
#
# AUTOMATIONER OCH DASHBOARD SKA LÄSA HÄRIFRÅN:
#   state_attr('sensor.gen24_battery_hub', '<attributnamn>')
#
# Tillgängliga attribut — se legend-attributet längst ner.
# =============================================================================

template:
  - sensor:
      - name: "GEN24 Battery Hub"
        unique_id: gen24_battery_hub
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement

        icon: >-
          {% set soc = states('sensor.gen24_battery_soc') | float(-1) %}
          {% if soc < 0 %}mdi:battery-unknown
          {% elif soc >= 90 %}mdi:battery
          {% elif soc >= 70 %}mdi:battery-80
          {% elif soc >= 50 %}mdi:battery-60
          {% elif soc >= 30 %}mdi:battery-40
          {% elif soc >= 15 %}mdi:battery-20
          {% else %}mdi:battery-alert{% endif %}

        availability: >-
          {{ states('sensor.gen24_battery_soc') not in ['unknown','unavailable','none',''] }}

        state: >-
          {{ states('sensor.gen24_battery_soc') | float(0) | round(1) }}

        attributes:

          # ================================================================
          # KAPACITET & ENERGI
          # ================================================================

          soc_pct: >-
            {{ states('sensor.gen24_battery_soc') | float(-1) | round(1) }}

          capacity_kwh: >-
            {{ states('input_number.gen24_battery_capacity_kwh') | float(17) }}

          soc_kwh: >-
            {% set soc = states('sensor.gen24_battery_soc') | float(-1) %}
            {% set cap = states('input_number.gen24_battery_capacity_kwh') | float(17) %}
            {{ (soc / 100 * cap) | round(2) if soc >= 0 else -1 }}

          soc_usable_pct: >-
            {% set soc = states('sensor.gen24_battery_soc') | float(-1) %}
            {% set eff = states('input_number.gen24_effective_min_soc') | float(5) %}
            {{ [soc - eff, 0] | max | round(1) if soc >= 0 else -1 }}

          soc_usable_kwh: >-
            {% set soc = states('sensor.gen24_battery_soc') | float(-1) %}
            {% set eff = states('input_number.gen24_effective_min_soc') | float(5) %}
            {% set cap = states('input_number.gen24_battery_capacity_kwh') | float(17) %}
            {{ ([soc - eff, 0] | max / 100 * cap) | round(2) if soc >= 0 else -1 }}

          # ================================================================
          # EFFEKTFLÖDEN (W)
          # Teckenkonvention: pos = laddar, neg = urladdar
          # Källa: sensor.gen24_battery_power_signed
          # ================================================================

          net_power_w: >-
            {{ states('sensor.gen24_battery_power_signed') | float(0) | round(0) | int }}

          charging_w: >-
            {{ [states('sensor.gen24_battery_power_signed') | float(0), 0] | max | round(0) | int }}

          discharging_w: >-
            {{ [-(states('sensor.gen24_battery_power_signed') | float(0)), 0] | max | round(0) | int }}

          # ================================================================
          # DRIFTSTATUS
          # Hysteresisgräns 50 W för att undvika flimmer vid vila
          # ================================================================

          is_charging: >-
            {{ states('sensor.gen24_battery_power_signed') | float(0) > 50 }}

          is_discharging: >-
            {{ states('sensor.gen24_battery_power_signed') | float(0) < -50 }}

          is_idle: >-
            {{ (states('sensor.gen24_battery_power_signed') | float(0)) | abs <= 50 }}

          # ================================================================
          # MIN-SoC-HIERARKI
          # Läs effective_min_soc — det är den aktiva gränsen.
          # Skriv ALDRIG hit direkt; ändra via input_number.gen24_policy_min_soc.
          # ================================================================

          min_soc_policy: >-
            {{ states('input_number.gen24_policy_min_soc') | float(5) | round(1) }}

          min_soc_safety: >-
            {{ states('input_number.gen24_safety_min_soc') | float(5) | round(1) }}

          min_soc_hold: >-
            {{ states('input_number.gen24_hold_min_soc') | float(5) | round(1) }}

          min_soc_effective: >-
            {{ states('input_number.gen24_effective_min_soc') | float(5) | round(1) }}

          min_soc_hardware: >-
            {{ states('input_number.gen24_inverter_min_soc') | float(10) | round(1) }}

          hold_until: >-
            {{ states('input_datetime.gen24_hold_min_soc_until') }}

          is_hold_active: >-
            {% set hold = states('input_number.gen24_hold_min_soc') | float(0) %}
            {% set policy = states('input_number.gen24_policy_min_soc') | float(0) %}
            {% set until_str = states('input_datetime.gen24_hold_min_soc_until') %}
            {% set until_ts = as_timestamp(until_str, 0) %}
            {% if until_ts > 0 %}
              {{ hold > policy and as_timestamp(now()) < until_ts }}
            {% else %}
              false
            {% endif %}

          # ================================================================
          # SoC-MÅL & POLICY
          # ================================================================

          target_soc: >-
            {{ states('sensor.gen24_dynamic_target_soc') | float(80) | round(1) }}

          headroom_to_target_pct: >-
            {% set soc = states('sensor.gen24_battery_soc') | float(-1) %}
            {% set tgt = states('sensor.gen24_dynamic_target_soc') | float(80) %}
            {{ [tgt - soc, 0] | max | round(1) if soc >= 0 else -1 }}

          headroom_to_target_kwh: >-
            {% set soc = states('sensor.gen24_battery_soc') | float(-1) %}
            {% set tgt = states('sensor.gen24_dynamic_target_soc') | float(80) %}
            {% set cap = states('input_number.gen24_battery_capacity_kwh') | float(17) %}
            {{ ([tgt - soc, 0] | max / 100 * cap) | round(2) if soc >= 0 else -1 }}

          # PV-prognosdrivet AKTIVT laddmål (sensor.gen24_charge_target_soc):
          # mycket sol imorgon -> lågt mål, lite sol -> högt mål. Detta är målet
          # ChargeCheap faktiskt laddar till just nu.
          charge_cheap_target_soc: >-
            {% set t = states('sensor.gen24_charge_target_soc') %}
            {% if t not in ['unknown','unavailable','none',''] %}
              {{ t | float(85) | round(1) }}
            {% else %}
              {{ states('input_number.gen24_chargecheap_target_soc') | float(85) | round(1) }}
            {% endif %}

          # Statiskt TAK (används när morgondagens PV-prognos är låg)
          charge_cheap_target_ceiling: >-
            {{ states('input_number.gen24_chargecheap_target_soc') | float(85) | round(1) }}

          # Statiskt GOLV (används när morgondagens PV-prognos är hög)
          charge_cheap_target_floor: >-
            {{ states('input_number.gen24_charge_target_min_soc') | float(30) | round(1) }}

          charge_cheap_min_soc: >-
            {{ states('input_number.gen24_chargecheap_min_soc') | float(20) | round(1) }}

          night_discharge_trigger_soc: >-
            {{ states('input_number.gen24_night_discharge_soc_trigger') | float(60) | round(1) }}

          night_discharge_target_soc: >-
            {{ states('input_number.gen24_night_discharge_target_soc') | float(40) | round(1) }}

          export_min_soc: >-
            {{ states('input_number.gen24_exportmode_min_soc_force_export') | float(65) | round(1) }}

          night_charging_enabled: >-
            {{ is_state('input_boolean.gen24_night_charging_enabled', 'on') }}

          # ================================================================
          # SÄKERHETSSTATUS
          # ================================================================

          is_above_minimum: >-
            {% set soc = states('sensor.gen24_battery_soc') | float(-1) %}
            {% set eff = states('input_number.gen24_effective_min_soc') | float(5) %}
            {{ soc >= 0 and soc >= eff }}

          is_above_hardware_minimum: >-
            {% set soc = states('sensor.gen24_battery_soc') | float(-1) %}
            {% set hw = states('input_number.gen24_inverter_min_soc') | float(10) %}
            {{ soc >= 0 and soc >= hw }}

          # ================================================================
          # LÅS & KOMMANDOSTATUS
          # ================================================================

          lock_owner: >-
            {{ states('input_text.gen24_lock_owner') | default('none') }}

          last_command: >-
            {{ states('input_text.gen24_last_battery_command') | default('none') }}

          last_action: >-
            {{ states('input_text.gen24_last_automation_action') | default('none') }}

          # ================================================================
          # MARGINALVÄRDE
          # Score 0–100 beräknad av automationen:
          # Högt (>70) = batteriet är värdefullt, behåll energin
          # Lågt (<30) = lågt värde, ladda ur om möjligt
          # ================================================================

          marginal_value: >-
            {{ states('sensor.gen24_battery_marginal_value') | float(50) | round(1) }}

          # ================================================================
          # LEGEND — begrepp och enheter
          # ================================================================

          legend: >-
            gen24_battery_hub – begrepp och enheter.
            STATE (%) = SoC aktuell laddningsnivå.
            soc_pct       = SoC i procent (samma som state).
            capacity_kwh  = Total batterikapacitet (konfigurerat värde).
            soc_kwh       = Faktisk energi i batteriet nu (kWh).
            soc_usable_pct  = SoC tillgänglig ovanför effective_min_soc (%).
            soc_usable_kwh  = Energi tillgänglig ovanför effective_min_soc (kWh).
            net_power_w   = Nettobatteriflöde W, pos=laddar, neg=urladdar.
            charging_w    = Laddeffekt W (alltid ≥ 0).
            discharging_w = Urladdningseffekt W (alltid ≥ 0).
            is_charging   = True om batteriet laddar (>50 W).
            is_discharging= True om batteriet urladdar (>50 W).
            is_idle       = True om batteriet vilar (|flöde| ≤ 50 W).
            min_soc_policy   = Användarens valda min-SoC (normaldrift).
            min_soc_safety   = Peak-justerad säkerhetsgräns.
            min_soc_hold     = Temporär hold-gräns (satt av automation).
            min_soc_effective= max(policy,safety,hold) — den AKTIVA gränsen.
            min_soc_hardware = Invertergräns (absolut hårdvarugräns, 10%).
            hold_until       = Tidsstämpel när hold-läge upphör.
            is_hold_active   = True om hold > policy och now() < hold_until.
            target_soc            = Dynamiskt SoC-mål (sensor.gen24_dynamic_target_soc).
            headroom_to_target_pct= Utrymme till mål (%).
            headroom_to_target_kwh= Utrymme till mål (kWh).
            charge_cheap_target_soc= ChargeCheap laddar till denna SoC (%).
            charge_cheap_min_soc   = ChargeCheap aktiveras endast om SoC < detta (%).
            night_discharge_trigger_soc= Nattutladdning startar vid SoC > detta (%).
            night_discharge_target_soc = Nattutladdning stannar vid SoC < detta (%).
            export_min_soc         = Min SoC för tvingad export utan PV (%).
            night_charging_enabled = True om nattladdning är aktiverad.
            is_above_minimum       = True om SoC >= effective_min_soc.
            is_above_hardware_minimum= True om SoC >= min_soc_hardware.
            lock_owner    = Vem äger nuvarande styrningslås.
            last_command  = Senaste MQTT-kommando skickat till batteriet.
            last_action   = Senaste automationsåtgärd (loggtext).
            marginal_value= Batteriets marginalvärde 0–100
                            (hög=behåll energin, låg=ladda ur om möjligt).
