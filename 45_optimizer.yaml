# =============================================================================
# 45_optimizer.yaml  —  resultat-helpers för extern optimerare (kolumn B + C)
# =============================================================================
# Optimeraren körs i en EXTERN container (Proxmox LXC) via HA REST API.
# Denna fil definierar bara de helpers som det externa skriptet skriver till.
#
# Se README_external_optimizer.md för setup.
#
# Skriptet beräknar:
#   A = faktiskt utfall (SEK)
#   B = replay av var state machine (SEK)
#   C = teoretiskt optimal (SEK)
# och skriver resultatet till dessa helpers via REST.
# =============================================================================

input_number:
  gen24_opt_cost_actual:
    name: "GEN24 Opt Cost Actual"
    icon: mdi:cash
    unit_of_measurement: "SEK"
    min: -1000
    max: 1000
    step: 0.01
    initial: 0

  gen24_opt_cost_replay:
    name: "GEN24 Opt Cost Replay"
    icon: mdi:cash-refund
    unit_of_measurement: "SEK"
    min: -1000
    max: 1000
    step: 0.01
    initial: 0

  gen24_opt_cost_optimal:
    name: "GEN24 Opt Cost Optimal"
    icon: mdi:cash-check
    unit_of_measurement: "SEK"
    min: -1000
    max: 1000
    step: 0.01
    initial: 0

input_text:
  gen24_opt_report:
    name: "GEN24 Opt Report"
    icon: mdi:file-chart
    max: 255
    initial: ""
