# =============================================================================
# 20_state_machine.yaml  â€”  read-only state machine, fas 1
# =============================================================================
# Innehaller:
#   - sensor.gen24_state_input                (normaliserad snapshot)
#   - sensor.gen24_state_decision             (EN beslutsfattare)
#   - sensor.gen24_state_transition_log       (lista over senaste vaxlingar)
#   - sensor.gen24_control_hub                (debug/overvakning)
#
# Allt ar READ-ONLY. Inga MQTT-kommandon skickas.
#
# Guardar (harda):
#   - data_quality maste vara COHERENT
#   - snapshot_age_ms maste vara < 10 000
#   - sensor.gen24_shadow_status maste vara OK
# Om nagot misslyckas -> DATA_QUALITY_REJECT (action=BLOCK).
# =============================================================================

template:
  - trigger:
      - platform: state
        entity_id: sensor.gen24_shadow_decision_sample
        not_to:
          - "unavailable"
          - "unknown"
      - platform: state
        entity_id: sensor.gen24_shadow_control_mode_live
        not_to:
          - "unavailable"
          - "unknown"
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "GEN24 State Input"
        unique_id: gen24_state_input
        icon: mdi:database
        state: >-
          {% set dq = state_attr('sensor.gen24_shadow_decision_sample', 'data_quality') | default('unknown') %}
          {{ dq | upper }}
        attributes:
          data_quality: >-
            {{ state_attr('sensor.gen24_shadow_decision_sample', 'data_quality') | default('unknown') }}
          firmware_timestamp: >-
            {{ state_attr('sensor.gen24_shadow_decision_sample', 'firmware_timestamp') | default('unknown') }}
          snapshot_age_ms: >-
            {% set ts = state_attr('sensor.gen24_shadow_decision_sample', 'firmware_timestamp') %}
            {% if ts is not none and ts != 'unknown' and ts != '' and as_timestamp(ts) is not none %}
              {{ ((now().timestamp() - as_timestamp(ts)) * 1000) | int }}
            {% else %}
              99999
            {% endif %}
          control_mode: >-
            {% set live = states('sensor.gen24_shadow_control_mode_live') %}
            {% if live not in ['unknown','unavailable','none',''] %}
              {{ live }}
            {% else %}
              {{ state_attr('sensor.gen24_shadow_decision_sample', 'control_mode') | default('AUTO') }}
            {% endif %}
          soc_pct: >-
            {% set raw = state_attr('sensor.gen24_shadow_decision_sample', 'soc_pct') %}
            {{ raw | float if raw is not none else 0 }}
          pv_w: >-
            {% set raw = state_attr('sensor.gen24_shadow_decision_sample', 'pv_w') %}
            {{ raw | float if raw is not none else 0 }}
          grid_w: >-
            {% set raw = state_attr('sensor.gen24_shadow_decision_sample', 'grid_w') %}
            {{ raw | float if raw is not none else 0 }}
          load_w: >-
            {% set raw = state_attr('sensor.gen24_shadow_decision_sample', 'load_w') %}
            {{ raw | float if raw is not none else 0 }}
          battery_w: >-
            {% set raw = state_attr('sensor.gen24_shadow_decision_sample', 'battery_w') %}
            {{ raw | float if raw is not none else 0 }}
          raw_load_w: >-
            {% set raw = state_attr('sensor.gen24_shadow_decision_sample', 'raw_load_w') %}
            {{ raw | float if raw is not none else 0 }}
          load_source_mode: >-
            {{ state_attr('sensor.gen24_shadow_decision_sample', 'load_source_mode') | default('unknown') }}
          observed_action: >-
            {{ state_attr('sensor.gen24_shadow_decision_sample', 'observed_action') | default('IDLE') }}
          residual_w: >-
            {% set raw = state_attr('sensor.gen24_shadow_decision_sample', 'power_balance_residual_w') %}
            {{ raw | float if raw is not none else 99999 }}
          shadow_status: >-
            {{ states('sensor.gen24_shadow_status') | default('UNKNOWN') }}

  - sensor:
      - name: "GEN24 State Decision"
        unique_id: gen24_state_decision
        icon: mdi:state-machine
        state: >-
          {% set input = 'sensor.gen24_state_input' %}
          {% set dq = state_attr(input, 'data_quality') | default('unknown') %}
          {% set age = state_attr(input, 'snapshot_age_ms') | default(99999) | int %}
          {% set shadow = state_attr(input, 'shadow_status') | default('UNKNOWN') %}
          {% if dq != 'COHERENT' or age >= 10000 or shadow not in ['OK'] %}
            DATA_QUALITY_REJECT
          {% else %}
            {% set mode = state_attr(input, 'control_mode') | default('AUTO') %}
            {% set strategy = states('input_select.gen24_control_strategy') %}
            {% set ui_cmd = states('input_select.gen24_last_ui_command') %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set grid = state_attr(input, 'grid_w') | default(0) | float %}
            {% set pv = state_attr(input, 'pv_w') | default(0) | float %}
            {% set load = state_attr(input, 'load_w') | default(0) | float %}
            {% set battery = state_attr(input, 'battery_w') | default(0) | float %}
            {% set hour = now().hour %}
            {% set daytime = hour >= 6 and hour < 22 %}
            {% set fast = strategy == 'Peak shave - fast pris' %}
            {% set rorligt = strategy == 'Peak shave - rörligt pris' %}
            {% set prisstrategi = fast or rorligt %}
            {% set manuell = mode == 'MANUAL' and ui_cmd == 'none' %}
            {% if mode == 'MANUAL' and ui_cmd != 'none' %}
              UI_OVERRIDE
            {% elif mode == 'AUTO' %}
              AUTO
            {% elif not prisstrategi %}
              IDLE
            {% else %}
              {% set ns = namespace(candidates=[]) %}
              {# --- PEAK_SHAVE (80) --- #}
              {% set limit_kw = states('sensor.gen24_peak_limit_active_kw') | float(0) %}
              {% set margin_kw = states('input_number.gen24_peak_margin_kw') | float(0.30) %}
              {% set soc_min = states('input_number.gen24_soc_min_safe') | float(15) %}
              {% set grid_import_kw = (grid | float(0)) / 1000 %}
              {% set target_kw = limit_kw - margin_kw %}
              {% if manuell and limit_kw > 0 and grid_import_kw > target_kw and soc > soc_min %}
                {% set ns.candidates = ns.candidates + [(80, 'PEAK_SHAVE')] %}
              {% endif %}
              {# --- EXPORT (75) --- #}
              {% set sell_price = states('sensor.gen24_sell_price') | float(-999) %}
              {% set sell_thr = states('sensor.gen24_sell_threshold') | float(-999) %}
              {% set expensive_thr = states('input_number.gen24_price_expensive_threshold_sek') | float(0.80) %}
              {% set nordpool = states('sensor.nordpool_kwh_se3_sek_3_10_025') | float(-1) %}
              {% if sell_price > -900 and sell_thr > -900 %}
                {% set sell_attractive = sell_price >= sell_thr %}
              {% else %}
                {% set sell_attractive = nordpool >= 0 and nordpool >= expensive_thr %}
              {% endif %}
              {% set export_score = states('sensor.gen24_export_value_now') | float(0) %}
              {% set eff_value = states('sensor.gen24_effective_battery_value') | float(50) %}
              {% set export_edge = export_score - eff_value %}
              {% set reserve_soc = states('sensor.gen24_peak_reserve_soc') | float(20) %}
              {% set eff_min = states('input_number.gen24_effective_min_soc') | float(0) %}
              {% set export_floor = states('input_number.gen24_exportmode_min_soc_force_export') | float(65) %}
              {% set dyn_target = states('sensor.gen24_dynamic_target_soc') | float(70) %}
              {% set sched_risk = states('sensor.gen24_scheduled_load_risk') | float(0) %}
              {% set car = states('sensor.wattpilot_carconnected') | lower %}
              {% set ev_wants_charge = car in ['ready','charging'] and car != 'complete' %}
              {% set reserve_gate = [reserve_soc, eff_min + 5, [dyn_target, export_floor] | max] | max %}
              {% if manuell and daytime and sell_attractive and export_score >= 55 and export_edge >= 8 and soc > reserve_gate and sched_risk < 80 and not ev_wants_charge %}
                {% set ns.candidates = ns.candidates + [(75, 'EXPORT')] %}
              {% endif %}
              {# --- SELF_CONS_DAY (72) --- #}
              {% set selfcons_on = is_state('input_boolean.gen24_selfcons_enabled', 'on') %}
              {% set soc_target = states('sensor.gen24_dynamic_target_soc') | float(80) %}
              {% set reserve_floor = states('sensor.gen24_active_reserve_floor') | float(soc_min) %}
              {% set base_floor = [soc_target - 10, soc_min + 5] | max %}
              {% set rem_solar = states('sensor.gen24_forecast_remaining_kwh') | float(-1) %}
              {% set cap_kwh = states('input_number.gen24_battery_capacity_kwh') | float(17) %}
              {% set refill_pct = ([rem_solar, cap_kwh] | min / cap_kwh * 100) | round(0) | int if (rem_solar >= 0 and cap_kwh > 0) else 0 %}
              {% set ns2 = namespace(floor=base_floor) %}
              {% if nordpool >= 0 and nordpool >= expensive_thr %}
                {% set ns2.floor = [reserve_floor, soc_min] | max %}
              {% elif rem_solar >= 0 and refill_pct > 10 %}
                {% set fc = [soc_target - refill_pct, soc_min + 5] | max %}
                {% set ns2.floor = [base_floor, fc] | min %}
              {% endif %}
              {% set selfcons_floor = ns2.floor %}
              {% set min_import_w = states('input_number.gen24_selfcons_min_import_w') | int(100) %}
              {% set grid_import_w = grid | float(0) %}
              {% if manuell and selfcons_on and daytime and soc > selfcons_floor and grid_import_w >= min_import_w %}
                {% set ns.candidates = ns.candidates + [(72, 'SELF_CONS_DAY')] %}
              {% endif %}
              {# --- NIGHT_BATTERY (70) --- #}
              {% set night_trig = states('input_number.gen24_night_discharge_soc_trigger') | float(60) %}
              {% set night_target = states('input_number.gen24_night_discharge_target_soc') | float(40) %}
              {% set night_solar_min = states('input_number.gen24_night_solar_min_kwh') | float(4) %}
              {% set pv_tomorrow_kwh = states('sensor.gen24_forecast_tomorrow_kwh') | float(-1) %}
              {% set night_charging = is_state('input_boolean.gen24_night_charging_enabled', 'on') %}
              {% if manuell and not daytime and night_charging and soc > night_trig and soc > night_target and pv_tomorrow_kwh >= night_solar_min %}
                {% set ns.candidates = ns.candidates + [(70, 'NIGHT_BATTERY')] %}
              {% endif %}
              {# --- SELF_CONS_NIGHT (66) --- #}
              {% if manuell and selfcons_on and not daytime and soc > selfcons_floor and grid_import_w >= min_import_w %}
                {% set ns.candidates = ns.candidates + [(66, 'SELF_CONS_NIGHT')] %}
              {% endif %}
              {# --- SOLAR_CHARGE (64) --- #}
              {% set soc_max = states('input_number.gen24_solar_charge_soc_max') | float(95) %}
              {% set export_w = states('sensor.gen24_grid_export_power') | float(0) %}
              {% set solar_min_w = states('input_number.gen24_solar_export_min_w') | int(150) %}
              {% if manuell and daytime and soc < soc_max and export_w >= solar_min_w %}
                {% set ns.candidates = ns.candidates + [(64, 'SOLAR_CHARGE')] %}
              {% endif %}
              {# --- CHARGE_CHEAP (60) --- #}
              {% set charge_thr = states('sensor.gen24_charge_threshold') %}
              {% set cheap_th = (charge_thr | float) if charge_thr not in ['unknown','unavailable','none',''] else (states('input_number.gen24_price_cheap_threshold_sek') | float(0.50)) %}
              {% set charge_target = states('sensor.gen24_charge_target_soc') | float(dyn_target) %}
              {% set charge_bias = 0 %}
              {% if eff_value >= 80 %}{% set charge_bias = charge_bias + 25 %}{% endif %}
              {% if sched_risk >= 60 %}{% set charge_bias = charge_bias + 20 %}{% endif %}
              {% if reserve_soc >= 40 %}{% set charge_bias = charge_bias + 10 %}{% endif %}
              {% if soc < reserve_soc %}{% set charge_bias = charge_bias + 20 %}{% endif %}
              {% if soc < charge_target %}{% set charge_bias = charge_bias + 10 %}{% endif %}
              {% set price_is_cheap = nordpool >= 0 and nordpool < cheap_th %}
              {% if manuell and fast and soc < charge_target and price_is_cheap and charge_bias >= 20 %}
                {% set ns.candidates = ns.candidates + [(60, 'CHARGE_CHEAP')] %}
              {% endif %}
              {# --- DAYTIME_SMART (60) --- #}
              {% set very_cheap_ratio = states('input_number.gen24_price_very_cheap_ratio') | float(0.50) %}
              {% set price_is_very_cheap = nordpool >= 0 and nordpool < (expensive_thr * very_cheap_ratio) %}
              {% set fc_remaining = states('sensor.gen24_forecast_remaining_kwh') | float(0) %}
              {% set fc_gate_ratio = states('input_number.gen24_daytime_forecast_gate_ratio') | float(1.5) %}
              {% set soc_gap_pct = [dyn_target - soc, 0] | max %}
              {% set gap_kwh = (soc_gap_pct / 100) * cap_kwh %}
              {% set solar_covers_gap = fc_remaining > 0 and fc_remaining >= (gap_kwh * fc_gate_ratio) %}
              {% set price_is_cheap_day = nordpool >= 0 and nordpool < expensive_thr %}
              {% set value_bias = 0 %}
              {% if eff_value >= 80 %}{% set value_bias = value_bias + 25 %}{% endif %}
              {% if sched_risk >= 60 %}{% set value_bias = value_bias + 20 %}{% endif %}
              {% if reserve_soc >= 40 %}{% set value_bias = value_bias + 10 %}{% endif %}
              {% if soc < reserve_soc %}{% set value_bias = value_bias + 20 %}{% endif %}
              {% if soc < dyn_target %}{% set value_bias = value_bias + 10 %}{% endif %}
              {% if manuell and rorligt and daytime and export_w < 200 and price_is_cheap_day and soc < dyn_target and not (solar_covers_gap and soc >= reserve_soc) and (value_bias >= 15 or price_is_very_cheap) %}
                {% set ns.candidates = ns.candidates + [(60, 'DAYTIME_SMART')] %}
              {% endif %}
              {% if ns.candidates %}
                {{ (ns.candidates | sort(reverse=true))[0][1] }}
              {% else %}
                IDLE
              {% endif %}
            {% endif %}
          {% endif %}
        attributes:
          action: >-
            {% if this.state == 'DATA_QUALITY_REJECT' %}BLOCK
            {% elif this.state in ['AUTO','MANUAL','UI_OVERRIDE'] %}IDLE
            {% elif this.state in ['SOLAR_CHARGE','NIGHT_BATTERY','CHARGE_CHEAP','DAYTIME_SMART'] %}CHARGE
            {% elif this.state in ['EXPORT','SELF_CONS_DAY','SELF_CONS_NIGHT','PEAK_SHAVE'] %}DISCHARGE
            {% else %}IDLE{% endif %}
          power_w: >-
            {% set battery = state_attr('sensor.gen24_state_input', 'battery_w') | default(0) | float %}
            {% if this.state in ['SOLAR_CHARGE','NIGHT_BATTERY','CHARGE_CHEAP','DAYTIME_SMART'] %}{{ (-battery) | abs | int }}
            {% elif this.state in ['EXPORT','SELF_CONS_DAY','SELF_CONS_NIGHT','PEAK_SHAVE'] %}{{ battery | int }}
            {% else %}0{% endif %}
          priority: >-
            {% set priorities = {
              'DATA_QUALITY_REJECT': 99,
              'UI_OVERRIDE': 95,
              'MANUAL': 90,
              'PEAK_SHAVE': 80,
              'EXPORT': 75,
              'SELF_CONS_DAY': 72,
              'SELF_CONS_NIGHT': 66,
              'NIGHT_BATTERY': 70,
              'SOLAR_CHARGE': 64,
              'CHARGE_CHEAP': 60,
              'DAYTIME_SMART': 60,
              'AUTO': 10,
              'IDLE': 0
            } %}
            {{ priorities.get(this.state, 0) }}
          reason: >-
            {% set reasons = {
              'DATA_QUALITY_REJECT': 'data_quality_or_stale_or_shadow_not_ok',
              'UI_OVERRIDE': 'ui_command_override',
              'MANUAL': 'control_mode_manual',
              'PEAK_SHAVE': 'peak_shave_grid_import_above_target',
              'EXPORT': 'export_arbitrage_attractive',
              'SELF_CONS_DAY': 'self_consumption_day_discharge',
              'SELF_CONS_NIGHT': 'self_consumption_night_discharge',
              'NIGHT_BATTERY': 'night_battery_discharge',
              'SOLAR_CHARGE': 'pv_surplus_charge',
              'CHARGE_CHEAP': 'charge_cheap_low_price',
              'DAYTIME_SMART': 'daytime_smart_cheap_charge',
              'AUTO': 'control_mode_auto',
              'IDLE': 'no_active_state'
            } %}
            {{ reasons.get(this.state, 'unknown') }}
          guard: >-
            {{ this.state != 'DATA_QUALITY_REJECT' }}
          is_safe_to_act: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set dq = state_attr(input, 'data_quality') | default('unknown') %}
            {% set age = state_attr(input, 'snapshot_age_ms') | default(99999) | int %}
            {% set shadow = state_attr(input, 'shadow_status') | default('UNKNOWN') %}
            {{ dq == 'COHERENT' and age < 10000 and shadow in ['OK'] }}
          input_data_quality: >-
            {{ state_attr('sensor.gen24_state_input', 'data_quality') }}
          input_snapshot_age_ms: >-
            {{ state_attr('sensor.gen24_state_input', 'snapshot_age_ms') }}
          input_control_mode: >-
            {{ state_attr('sensor.gen24_state_input', 'control_mode') }}
          input_battery_w: >-
            {{ state_attr('sensor.gen24_state_input', 'battery_w') }}
          input_grid_w: >-
            {{ state_attr('sensor.gen24_state_input', 'grid_w') }}
          strategy: >-
            {{ states('input_select.gen24_control_strategy') }}
          guards_implemented: "8/8"
          guard_peak_shave: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set grid = state_attr(input, 'grid_w') | default(0) | float %}
            {% set limit_kw = states('sensor.gen24_peak_limit_active_kw') | float(0) %}
            {% set margin_kw = states('input_number.gen24_peak_margin_kw') | float(0.30) %}
            {% set soc_min = states('input_number.gen24_soc_min_safe') | float(15) %}
            {% set grid_import_kw = (grid | float(0)) / 1000 %}
            {% set target_kw = limit_kw - margin_kw %}
            {{ 'PASS' if (limit_kw > 0 and grid_import_kw > target_kw and soc > soc_min) else 'BLOCK' }}
          guard_export: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set sell_price = states('sensor.gen24_sell_price') | float(-999) %}
            {% set sell_thr = states('sensor.gen24_sell_threshold') | float(-999) %}
            {% set export_score = states('sensor.gen24_export_value_now') | float(0) %}
            {% set eff_value = states('sensor.gen24_effective_battery_value') | float(50) %}
            {% set export_edge = export_score - eff_value %}
            {% set reserve_soc = states('sensor.gen24_peak_reserve_soc') | float(20) %}
            {% set eff_min = states('input_number.gen24_effective_min_soc') | float(0) %}
            {% set export_floor = states('input_number.gen24_exportmode_min_soc_force_export') | float(65) %}
            {% set dyn_target = states('sensor.gen24_dynamic_target_soc') | float(70) %}
            {% set sched_risk = states('sensor.gen24_scheduled_load_risk') | float(0) %}
            {% set reserve_gate = [reserve_soc, eff_min + 5, [dyn_target, export_floor] | max] | max %}
            {% set sell_attractive = (sell_price > -900 and sell_thr > -900 and sell_price >= sell_thr) %}
            {{ 'PASS' if (sell_attractive and export_score >= 55 and export_edge >= 8 and soc > reserve_gate and sched_risk < 80) else 'BLOCK' }}
          guard_selfcons_day: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set grid = state_attr(input, 'grid_w') | default(0) | float %}
            {% set soc_min = states('input_number.gen24_soc_min_safe') | float(15) %}
            {% set soc_target = states('sensor.gen24_dynamic_target_soc') | float(80) %}
            {% set min_import_w = states('input_number.gen24_selfcons_min_import_w') | int(100) %}
            {% set base_floor = [soc_target - 10, soc_min + 5] | max %}
            {% set selfcons_on = is_state('input_boolean.gen24_selfcons_enabled', 'on') %}
            {{ 'PASS' if (selfcons_on and soc > base_floor and grid >= min_import_w) else 'BLOCK' }}
          guard_night_battery: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set night_trig = states('input_number.gen24_night_discharge_soc_trigger') | float(60) %}
            {% set night_target = states('input_number.gen24_night_discharge_target_soc') | float(40) %}
            {% set night_solar_min = states('input_number.gen24_night_solar_min_kwh') | float(4) %}
            {% set pv_tomorrow_kwh = states('sensor.gen24_forecast_tomorrow_kwh') | float(-1) %}
            {% set night_charging = is_state('input_boolean.gen24_night_charging_enabled', 'on') %}
            {{ 'PASS' if (night_charging and soc > night_trig and soc > night_target and pv_tomorrow_kwh >= night_solar_min) else 'BLOCK' }}
          guard_selfcons_night: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set grid = state_attr(input, 'grid_w') | default(0) | float %}
            {% set soc_min = states('input_number.gen24_soc_min_safe') | float(15) %}
            {% set soc_target = states('sensor.gen24_dynamic_target_soc') | float(80) %}
            {% set min_import_w = states('input_number.gen24_selfcons_min_import_w') | int(100) %}
            {% set base_floor = [soc_target - 10, soc_min + 5] | max %}
            {% set selfcons_on = is_state('input_boolean.gen24_selfcons_enabled', 'on') %}
            {{ 'PASS' if (selfcons_on and soc > base_floor and grid >= min_import_w) else 'BLOCK' }}
          guard_solar_charge: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set soc_max = states('input_number.gen24_solar_charge_soc_max') | float(95) %}
            {% set export_w = states('sensor.gen24_grid_export_power') | float(0) %}
            {% set solar_min_w = states('input_number.gen24_solar_export_min_w') | int(150) %}
            {{ 'PASS' if (soc < soc_max and export_w >= solar_min_w) else 'BLOCK' }}
          guard_charge_cheap: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set charge_thr = states('sensor.gen24_charge_threshold') %}
            {% set cheap_th = (charge_thr | float) if charge_thr not in ['unknown','unavailable','none',''] else (states('input_number.gen24_price_cheap_threshold_sek') | float(0.50)) %}
            {% set dyn_target = states('sensor.gen24_dynamic_target_soc') | float(70) %}
            {% set charge_target = states('sensor.gen24_charge_target_soc') | float(dyn_target) %}
            {% set nordpool = states('sensor.nordpool_kwh_se3_sek_3_10_025') | float(-1) %}
            {% set eff_value = states('sensor.gen24_effective_battery_value') | float(50) %}
            {% set sched_risk = states('sensor.gen24_scheduled_load_risk') | float(0) %}
            {% set reserve_soc = states('sensor.gen24_peak_reserve_soc') | float(20) %}
            {% set charge_bias = 0 %}
            {% if eff_value >= 80 %}{% set charge_bias = charge_bias + 25 %}{% endif %}
            {% if sched_risk >= 60 %}{% set charge_bias = charge_bias + 20 %}{% endif %}
            {% if reserve_soc >= 40 %}{% set charge_bias = charge_bias + 10 %}{% endif %}
            {% if soc < reserve_soc %}{% set charge_bias = charge_bias + 20 %}{% endif %}
            {% if soc < charge_target %}{% set charge_bias = charge_bias + 10 %}{% endif %}
            {% set price_is_cheap = nordpool >= 0 and nordpool < cheap_th %}
            {{ 'PASS' if (soc < charge_target and price_is_cheap and charge_bias >= 20) else 'BLOCK' }}
          guard_daytime_smart: >-
            {% set input = 'sensor.gen24_state_input' %}
            {% set soc = state_attr(input, 'soc_pct') | default(0) | float %}
            {% set dyn_target = states('sensor.gen24_dynamic_target_soc') | float(70) %}
            {% set nordpool = states('sensor.nordpool_kwh_se3_sek_3_10_025') | float(-1) %}
            {% set expensive_thr = states('input_number.gen24_price_expensive_threshold_sek') | float(0.80) %}
            {% set export_w = states('sensor.gen24_grid_export_power') | float(0) %}
            {% set reserve_soc = states('sensor.gen24_peak_reserve_soc') | float(20) %}
            {% set price_is_cheap_day = nordpool >= 0 and nordpool < expensive_thr %}
            {{ 'PASS' if (export_w < 200 and price_is_cheap_day and soc < dyn_target) else 'BLOCK' }}

  - sensor:
      - name: "GEN24 Control Hub"
        unique_id: gen24_control_hub
        icon: mdi:chart-box-outline
        state: >-
          {% set safe = state_attr('sensor.gen24_state_decision', 'is_safe_to_act') %}
          {% if safe != true %}
            GUARD
          {% else %}
            {{ states('sensor.gen24_state_decision') }}
          {% endif %}
        attributes:
          shadow_status: >-
            {{ states('sensor.gen24_shadow_status') }}
          data_quality: >-
            {{ state_attr('sensor.gen24_state_input', 'data_quality') }}
          snapshot_age_ms: >-
            {{ state_attr('sensor.gen24_state_input', 'snapshot_age_ms') }}
          is_data_fresh: >-
            {{ (state_attr('sensor.gen24_state_input', 'snapshot_age_ms') | default(99999) | int) < 10000 }}
          is_data_coherent: >-
            {{ (state_attr('sensor.gen24_state_input', 'data_quality') | default('')) == 'COHERENT' }}
          is_shadow_ok: >-
            {{ states('sensor.gen24_shadow_status') in ['OK'] }}
          is_safe_to_act: >-
            {{ state_attr('sensor.gen24_state_decision', 'is_safe_to_act') }}
          control_mode: >-
            {{ state_attr('sensor.gen24_state_input', 'control_mode') }}
          soc_pct: >-
            {{ state_attr('sensor.gen24_state_input', 'soc_pct') }}
          pv_w: >-
            {{ state_attr('sensor.gen24_state_input', 'pv_w') }}
          grid_w: >-
            {{ state_attr('sensor.gen24_state_input', 'grid_w') }}
          load_w: >-
            {{ state_attr('sensor.gen24_state_input', 'load_w') }}
          battery_w: >-
            {{ state_attr('sensor.gen24_state_input', 'battery_w') }}
          observed_action: >-
            {{ state_attr('sensor.gen24_state_input', 'observed_action') }}
          residual_w: >-
            {{ state_attr('sensor.gen24_state_input', 'residual_w') }}
          state_decision: >-
            {{ states('sensor.gen24_state_decision') }}
          state_action: >-
            {{ state_attr('sensor.gen24_state_decision', 'action') }}
          state_power_w: >-
            {{ state_attr('sensor.gen24_state_decision', 'power_w') }}
          state_priority: >-
            {{ state_attr('sensor.gen24_state_decision', 'priority') }}
          state_reason: >-
            {{ state_attr('sensor.gen24_state_decision', 'reason') }}
          transition_log: >-
            {{ state_attr('sensor.gen24_state_transition_log', 'history') | default('') }}


  - trigger:
      - platform: state
        entity_id: sensor.gen24_state_decision
        not_from:
          - "unavailable"
          - "unknown"
        not_to:
          - "unavailable"
          - "unknown"
    sensor:
      - name: "GEN24 State Transition Log"
        unique_id: gen24_state_transition_log
        icon: mdi:timeline-text
        state: >-
          {% if trigger is defined and trigger.to_state is defined %}
            {{ trigger.to_state.state }}
          {% else %}
            none
          {% endif %}
        attributes:
          last_entry: >-
            {% if trigger is defined and trigger.from_state is defined and trigger.to_state is defined %}
              {{ now().strftime('%H:%M:%S') }}  {{ trigger.from_state.state }} -> {{ trigger.to_state.state }}  ({{ state_attr('sensor.gen24_state_decision','reason') | default('') }})
            {% else %}
              none
            {% endif %}
          history: >-
            {% if trigger is defined and trigger.from_state is defined and trigger.to_state is defined and trigger.from_state.state != trigger.to_state.state %}
              {% set prev = state_attr('sensor.gen24_state_transition_log', 'history') | default('', true) %}
              {% set r = (state_attr('sensor.gen24_state_decision','reason') | default(''))[:20] %}
              {% set line = now().strftime('%H:%M:%S') ~ ' ' ~ trigger.from_state.state[:10] ~ '>' ~ trigger.to_state.state[:10] ~ ' ' ~ r %}
              {% set combined = (line ~ '\n' ~ prev) %}
              {{ combined[:400] }}
            {% else %}
              {{ state_attr('sensor.gen24_state_transition_log', 'history') | default('', true) }}
            {% endif %}
          count: >-
            {% if trigger is defined and trigger.from_state is defined and trigger.to_state is defined and trigger.from_state.state != trigger.to_state.state %}
              {% set prev = state_attr('sensor.gen24_state_transition_log', 'count') | int(0) %}
              {{ prev + 1 }}
            {% else %}
              {{ state_attr('sensor.gen24_state_transition_log', 'count') | int(0) }}
            {% endif %}
