# =============================================================================
# gen24_shadow_config.yaml
# =============================================================================
# Shadow-systemets helpersdefinitioner.
#
# Dessa input_* helpers krävs av 20_state_machine.yaml men definierades inte
# i de tidigare shadow-paketen (de lever i produktion i 00_config.yaml).
#
# Fas 1: read-only / observationsläge. Inga kommandon skickas.
# Uppdatera initial-värden efter behov för teständamål.
# =============================================================================

input_boolean:

  gen24_selfcons_enabled:
    name: "GEN24 Självkonsumtion aktiverad"
    # Styr om SELF_CONS_DAY / SELF_CONS_NIGHT-guard passerar.
    # Sätt OFF för att inaktivera självkonsumtionsläge helt.
    initial: true
    icon: mdi:solar-panel

  # --- Planeringssensorer (scheduled load risk / reserve) ---
  gen24_scheduled_load_enabled:
    name: "GEN24 Schemalagd last aktiverad"
    initial: true
    icon: mdi:calendar-clock

  gen24_load_window_morning_enabled:
    name: "GEN24 Lastfönster morgon aktiverat"
    initial: true
    icon: mdi:weather-sunset-up

  gen24_load_window_evening_enabled:
    name: "GEN24 Lastfönster kväll aktiverat"
    initial: true
    icon: mdi:weather-sunset-down

  gen24_peak_penalty_active:
    # Aktiverar peak-tariff-läge i active_reserve_floor. OFF i shadow default.
    name: "GEN24 Peak-tariff aktiv"
    initial: false
    icon: mdi:cash-alert

input_number:

  gen24_soc_min_safe:
    # Absolut lägsta SoC — state machine tillåter ej urladdning under detta.
    name: "GEN24 Minimum SoC säker (%)"
    icon: mdi:battery-alert
    min: 0
    max: 50
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial: 15

  gen24_solar_charge_soc_max:
    # Övre SoC-gräns för SOLAR_CHARGE-läget (ladda via sol).
    name: "GEN24 Sol-laddning max SoC (%)"
    icon: mdi:battery-charging-90
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial: 95

  gen24_solar_export_min_w:
    # Minimieffekt (W) från solen för att SOLAR_CHARGE-läget ska vara aktuellt.
    name: "GEN24 Sol export minimum (W)"
    icon: mdi:solar-power
    min: 0
    max: 500
    step: 10
    unit_of_measurement: "W"
    mode: box
    initial: 150

  gen24_selfcons_min_import_w:
    # Hur mycket nätimport som tolereras innan batteriet urladdar.
    # Sänk = mer aggressiv självkonsumtion.
    name: "GEN24 Självkonsumtion min import (W)"
    icon: mdi:transmission-tower-import
    min: 50
    max: 1000
    step: 50
    unit_of_measurement: "W"
    mode: box
    initial: 100

  gen24_night_solar_min_kwh:
    # Om solprognosen imorgon är UNDER detta startar INTE natt-urladdning.
    name: "GEN24 Natt sol minimum (kWh)"
    icon: mdi:weather-sunny
    min: 1
    max: 30
    step: 0.5
    unit_of_measurement: "kWh"
    mode: box
    initial: 4

  gen24_peak_margin_kw:
    # Marginal (kW) under peak-gränsen för PEAK_SHAVE-läget.
    # OBS: PEAK_SHAVE-guardet kräver sensor.gen24_peak_limit_active
    # som inte är implementerad i shadow Fas 1 → guardet är alltid inaktivt.
    name: "GEN24 Peak-marginal (kW)"
    icon: mdi:chart-bell-curve-cumulative
    min: 0.0
    max: 2.0
    step: 0.05
    unit_of_measurement: "kW"
    mode: box
    initial: 0.30

  gen24_price_very_cheap_ratio:
    # Prisratio: om spotpris < cheap_threshold * detta → "mycket billigt".
    # Används i CHARGE_CHEAP-logiken.
    name: "GEN24 Pris mycket billigt ratio"
    icon: mdi:tag-arrow-down
    min: 0.0
    max: 1.0
    step: 0.05
    mode: slider
    initial: 0.50

  gen24_daytime_forecast_gate_ratio:
    # Dagtids-gate: om forecast_remaining > battery_remaining * detta
    # → DAYTIME_SMART blockeras (sol räcker, ladda inte).
    name: "GEN24 Dagtid forecast-gate ratio"
    icon: mdi:weather-sunny-alert
    min: 1.0
    max: 3.0
    step: 0.1
    mode: slider
    initial: 1.5

  gen24_forecast_low_kwh:
    # Låg prognoströskel för solar_forecast_score-beräkning.
    # Används av ps_10_forecast_score.yaml (beräknad sensor).
    name: "GEN24 Solar forecast low threshold (kWh remaining)"
    icon: mdi:solar-power-variant
    min: 0.5
    max: 15.0
    step: 0.5
    unit_of_measurement: "kWh"
    mode: box
    initial: 3.0

  # PLANERINGSSENSORER — indata som krävs av ps_20_planning_sensors.yaml
  # (peak_limit_active_kw, scheduled_load_risk, peak_reserve_soc, m.fl.)
  # Defaults hämtade från produktion .161 (00_config.yaml).
  # ---------------------------------------------------------------------------

  gen24_peak_limit_day_kw:
    name: "GEN24 Peak-gräns dag (06-22)"
    icon: mdi:speedometer
    min: 1
    max: 25
    step: 0.1
    unit_of_measurement: "kW"
    mode: box
    initial: 3.0

  gen24_peak_limit_night_kw:
    name: "GEN24 Peak-gräns natt (22-06)"
    icon: mdi:speedometer-slow
    min: 1
    max: 25
    step: 0.1
    unit_of_measurement: "kW"
    mode: box
    initial: 3.0

  gen24_load_window_lead_time_min:
    name: "GEN24 Lastfönster framförhållning (min)"
    icon: mdi:clock-alert-outline
    min: 0
    max: 240
    step: 5
    unit_of_measurement: "min"
    mode: box
    initial: 90

  gen24_load_window_min_reserve_soc:
    name: "GEN24 Lastfönster min reserv-SoC (%)"
    icon: mdi:battery-20
    min: 5
    max: 80
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial: 20

  gen24_load_window_max_reserve_soc:
    name: "GEN24 Lastfönster max reserv-SoC (%)"
    icon: mdi:battery-80
    min: 10
    max: 95
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial: 65

  gen24_load_window_morning_expected_kw:
    name: "GEN24 Lastfönster morgon förväntad (kW)"
    icon: mdi:weather-sunset-up
    min: 0
    max: 15
    step: 0.1
    unit_of_measurement: "kW"
    mode: box
    initial: 3.5

  gen24_load_window_evening_expected_kw:
    name: "GEN24 Lastfönster kväll förväntad (kW)"
    icon: mdi:weather-sunset-down
    min: 0
    max: 15
    step: 0.1
    unit_of_measurement: "kW"
    mode: box
    initial: 4.0

  gen24_shadow_scheduled_reserve_max_pct:
    name: "GEN24 Shadow schemalagd reserv max (%)"
    icon: mdi:battery-lock
    min: 0
    max: 50
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial: 20

input_select:

  gen24_control_strategy:
    name: "GEN24 Kontrollstrategi"
    options:
      - "Peak shave - fast pris"
      - "Peak shave - rörligt pris"
      - "Auto (inverter)"
      - "Manual"
    initial: "Peak shave - rörligt pris"
    icon: mdi:strategy

  gen24_last_ui_command:
    name: "GEN24 Senaste UI-kommando"
    # Sätts av UI-knappar i dashboarden.
    # "none" = ingen aktiv latch, state machine styr fritt.
    options:
      - "none"
      - "force_charge"
      - "force_discharge"
      - "pv_charge"
      - "block_charge"
      - "block_discharge"
      - "stop"
    initial: "none"
    icon: mdi:gesture-tap

  # ---------------------------------------------------------------------------
input_datetime:

  gen24_load_window_morning_start:
    name: "GEN24 Lastfönster morgon start"
    has_date: false
    has_time: true
    initial: "06:00:00"

  gen24_load_window_morning_end:
    name: "GEN24 Lastfönster morgon slut"
    has_date: false
    has_time: true
    initial: "09:00:00"

  gen24_load_window_evening_start:
    name: "GEN24 Lastfönster kväll start"
    has_date: false
    has_time: true
    initial: "17:00:00"

  gen24_load_window_evening_end:
    name: "GEN24 Lastfönster kväll slut"
    has_date: false
    has_time: true
    initial: "21:00:00"
