# =============================================================================
# mosquitto/gen24_forecast_bridge.conf
# =============================================================================
# MQTT-BRYGGA: hämtar forecast-topics från produktionens broker (.161)
# in i shadow-brokern (.123).
#
# BAKGRUND: .161 och .123 kör VAR SIN Mosquitto-broker. En automation på .161
# publicerar gen24_shadow/forecast/* till .161:s broker. Utan denna brygga når
# de aldrig .123. Bryggan prenumererar (in) på topicet från .161 och speglar in
# det lokalt på .123 så att gen24_forecast_bridge.yaml-sensorerna kan läsa det.
#
# INSTALLATION (på .123):
#   1. Kopiera denna fil till /share/mosquitto/gen24_forecast_bridge.conf
#      på .123 (skapa mappen om den saknas: mkdir -p /share/mosquitto)
#   2. Ersätt REMOTE_USER / REMOTE_PASS nedan med .161:s broker-inloggning.
#   3. Mosquitto-add-onens config (Inställningar → Add-ons → Mosquitto broker →
#      Configuration), lägg till:
#           customize:
#             active: true
#             folder: mosquitto
#   4. Starta om Mosquitto-add-onen på .123.
#   5. Verifiera: Developer Tools → MQTT → Listen på gen24_shadow/forecast/#
#      på .123 ska nu visa värdena inom 5 min.
#
# OBS SÄKERHET: repot är PUBLIKT — därför står inte lösenordet här. Fyll i
# REMOTE_USER/REMOTE_PASS DIREKT i filen på .123 (i /share, ej git-synkad).
# =============================================================================

connection gen24_161_forecast
address 192.168.1.161:1883

# Hämta (in) forecast-topics från .161 till .123. QoS 0.
topic gen24_shadow/forecast/# in 0

# Inloggning mot .161:s broker — FYLL I PÅ .123 (repot är publikt):
remote_username REMOTE_USER
remote_password REMOTE_PASS

bridge_protocol_version mqttv311
cleansession true
start_type automatic
try_private false
notifications false
