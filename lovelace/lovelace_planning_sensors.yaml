# =============================================================================
# lovelace_planning_sensors.yaml
# =============================================================================
# Visualisering av de 10 planeringssensorerna portade från .161
# (ps_20_planning_sensors.yaml)
# =============================================================================

type: vertical-stack
cards:
  - type: markdown
    content: |
      ## 📊 Planning Sensors (portade från .161)
      Ekonomi, peak-hantering och batterioptimering.

  # ====================================================================
  # EKONOMI & VÄRDERING
  # ====================================================================
  - type: entities
    title: Ekonomi & Värdering
    show_header_toggle: false
    entities:
      - entity: sensor.gen24_export_value_now
        name: Export-värde nu
        icon: mdi:cash-plus
      
      - entity: sensor.gen24_battery_marginal_value
        name: Batteri marginalvärde
        icon: mdi:battery-charging
      
      - entity: sensor.gen24_battery_value_score
        name: Batteri value score
        icon: mdi:star
      
      - entity: sensor.gen24_effective_battery_value
        name: Effektivt batterivärde
        icon: mdi:battery-heart-variant

  # ====================================================================
  # PEAK-HANTERING
  # ====================================================================
  - type: entities
    title: Peak-hantering
    show_header_toggle: false
    entities:
      - entity: sensor.gen24_peak_limit_active
        name: Aktivt peak-limit (kW)
        icon: mdi:transmission-tower
      
      - entity: sensor.gen24_peak_reserve_soc
        name: Peak reserve SOC (%)
        icon: mdi:battery-alert
      
      - entity: sensor.gen24_grid_import_2min_mean
        name: Import 2min medel (kW)
        icon: mdi:flash

  # ====================================================================
  # SCHEMALÄGGNING & TARIFF
  # ====================================================================
  - type: entities
    title: Schemaläggning & Tariff
    show_header_toggle: false
    entities:
      - entity: sensor.gen24_scheduled_load_risk
        name: Scheduled Load Risk
        icon: mdi:alert-circle
      
      - entity: sensor.gen24_active_reserve_floor
        name: Active Reserve Floor (%)
        icon: mdi:gauge-low
      
      - entity: sensor.gen24_tariff_period
        name: Tariffperiod
        icon: mdi:calendar-clock

  # ====================================================================
  # DIAGNOSTIK
  # ====================================================================
  - type: markdown
    content: |
      ### Status-check
      
      _En guard är "evaluerbar" när dess sensor finns och ger ett tal.
      Ett giltigt 0-score (t.ex. export nattetid) är EJ samma som död sensor._
      
      **PEAK_SHAVE guard:**
      {%- set p = states('sensor.gen24_peak_limit_active') %}
      {%- if p in ['unavailable', 'unknown', 'none', 'None', ''] %} Död ⚠️ (sensor saknas)
      {%- elif p | float(0) > 0 %} Evaluerbar ✅ (peak_limit = {{ p }} kW)
      {%- else %} Inaktiv ⚠️ (peak_limit = 0 — kontrollera input_number.gen24_peak_limit_day_kw/night_kw)
      {%- endif %}
      
      **EXPORT guard:**
      {%- set e = states('sensor.gen24_export_value_now') %}
      {%- if e in ['unavailable', 'unknown', 'none', 'None', ''] %} Död ⚠️ (sensor saknas)
      {%- else %} Evaluerbar ✅ (export_value = {{ e }}{{ ' — lågt/0 är normalt nattetid' if e | float(0) == 0 else '' }})
      {%- endif %}
      
      **Forecast-beroende guards:**
      {%- set f = states('sensor.gen24_forecast_remaining_kwh') %}
      {%- if f in ['-1', 'unavailable', 'unknown', 'none', 'None', ''] %} Inaktiva ⚠️ (forecast = {{ f }} — kontrollera MQTT-bryggan)
      {%- else %} Evaluerbara ✅ (remaining = {{ f }} kWh)
      {%- endif %}

  # ====================================================================
  # SCHEMA 2 DIAGNOSTIK (firmware 1.3.18+)
  # ====================================================================
  - type: markdown
    content: |
      ### 🔍 Datakvalitet (schema 2 / firmware 1.3.18+)

      **Schema:** {{ state_attr('sensor.gen24_state_input', 'sample_schema') | default(0) }}
      &nbsp;|&nbsp; **Quality Reason:** {{ state_attr('sensor.gen24_state_input', 'quality_reason') | default('–') }}
      &nbsp;|&nbsp; **Lastkälla:** {{ state_attr('sensor.gen24_state_input', 'load_source_mode') | default('–') }}

      | Diagnos | Värde | Gräns |
      |---|---|---|
      | GEN24 age | {{ state_attr('sensor.gen24_state_input', 'gen24_age_ms') | default(0) }} ms | < 30 000 ms |
      | SolarNet age | {{ state_attr('sensor.gen24_state_input', 'solarnet_age_ms') | default(0) }} ms | < 30 000 ms |
      | Source skew | {{ state_attr('sensor.gen24_state_input', 'source_skew_ms') | default(0) }} ms | < 6 000 ms |
      | Residual (fw) | {{ state_attr('sensor.gen24_state_input', 'residual_w') | default(0) }} W | < 500 W |

      **commands_enabled:** false &nbsp;|&nbsp; **Modbus:** READ-ONLY &nbsp;|&nbsp; **GEN24_CONTROL_WRITES_ENABLED:** 0

  - type: markdown
    content: |
      ### 📈 Reject-statistik (schema 2)

      **Period start:** {{ state_attr('sensor.gen24_state_evaluator', 'period_start') | default('–') }}

      | Mätvärde | Värde |
      |---|---|
      | Schema 2 sampel | {{ state_attr('sensor.gen24_state_evaluator', 'schema2_samples') | default(0) }} |
      | Schema 2 rejects | {{ state_attr('sensor.gen24_state_evaluator', 'schema2_rejects') | default(0) }} |
      | **Reject ratio (s2)** | **{{ state_attr('sensor.gen24_state_evaluator', 'schema2_reject_ratio_pct') | default(0) }} %** |
      | Reject ratio (alla) | {{ state_attr('sensor.gen24_state_evaluator', 'reject_ratio_pct') | default(0) }} % |

      **Reject per orsak (schema 2):**
      {%- set counts = state_attr('sensor.gen24_state_evaluator', 'quality_reason_counts') %}
      {%- if counts and counts | length > 0 %}
      {%- for reason, count in counts.items() %}
      - {{ reason }}: {{ count }}
      {%- endfor %}
      {%- else %}
      _Inga rejects ännu_
      {%- endif %}

      **Acceptanskriterier Fas 1→2 (efter 24–48h schema 2):**
      {%- set ratio = state_attr('sensor.gen24_state_evaluator', 'schema2_reject_ratio_pct') | default(100) | float %}
      {%- set schema = state_attr('sensor.gen24_state_input', 'sample_schema') | default(0) | int %}
      - Schema = 2: {{ '✅' if schema >= 2 else '⚠️ väntar på firmware 1.3.18' }}
      - commands_enabled = false: ✅
      - Reject ratio < 5 %: {{ '✅ (' + ratio | string + ' %)' if ratio < 5 else '⚠️ (' + ratio | string + ' %)' }}
      - POWER_BALANCE nära 0 %: granska quality_reason_counts ovan
      - SOURCE_SKEW nära 0 %: granska quality_reason_counts ovan
