# =============================================================================
# 25_state_evaluator.yaml  —  automatisk utvärdering av state machine
# =============================================================================
# Läser sensor.gen24_state_decision och sensor.gen24_shadow_decision_sample
# och räknar ut ett enkelt "scorecard" som sparas i attribut. Ingen styrning.
#
# Metrics:
#   - total_samples: antal sampel (uppdateras varje minut + vid decision-change)
#   - decision_distribution: antal per tillstånd
#   - reject_samples: antal DATA_QUALITY_REJECT
#   - reject_ratio_pct: andel reject
#   - observed_action_agreement: om vårt beslut matchar firmwarens observed_action
#   - agreement_score_pct: andel sampel där decision.action == observed_action
#   - last_mismatch: senaste mismatch med förklaring
#   - decision_quality_score: 0-100 (lägre reject + högre agreement = bättre)
#
# Triggas varje minut + när decision ändras.
# =============================================================================

template:
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id: sensor.gen24_state_decision
        not_to:
          - "unavailable"
          - "unknown"
    sensor:
      - name: "GEN24 State Evaluator"
        unique_id: gen24_state_evaluator
        icon: mdi:chart-line
        restore: false
        state: >-
          {% set score = this.attributes.get('decision_quality_score', 0) | int(0) %}
          {{ score }}
        attributes:
          total_samples: >-
            {% if trigger is defined and trigger.id == 'state' and trigger.from_state is defined and trigger.from_state.state == trigger.to_state.state %}
              {{ this.attributes.get('total_samples', 0) | int(0) }}
            {% else %}
              {{ this.attributes.get('total_samples', 0) | int(0) + 1 }}
            {% endif %}
          current_decision: >-
            {{ states('sensor.gen24_state_decision') }}
          current_observed_action: >-
            {{ state_attr('sensor.gen24_state_input', 'observed_action') | default('IDLE') }}
          current_action: >-
            {{ state_attr('sensor.gen24_state_decision', 'action') | default('IDLE') }}
          decision_distribution: >-
            {% set prev = this.attributes.get('decision_distribution', {}) %}
            {% set decision = states('sensor.gen24_state_decision') %}
            {% if decision not in ['unavailable','unknown','none',''] %}
              {{ dict(prev, **{decision: (prev.get(decision, 0) | int(0)) + 1}) }}
            {% else %}
              {{ prev }}
            {% endif %}
          reject_samples: >-
            {% set prev = this.attributes.get('reject_samples', 0) | int(0) %}
            {% set decision = states('sensor.gen24_state_decision') %}
            {% if decision == 'DATA_QUALITY_REJECT' %}
              {{ prev + 1 }}
            {% else %}
              {{ prev }}
            {% endif %}
          reject_ratio_pct: >-
            {% set total = this.attributes.get('total_samples', 0) | int(0) %}
            {% set rejects = this.attributes.get('reject_samples', 0) | int(0) %}
            {% if total > 0 %}{{ (rejects / total * 100) | round(1) }}{% else %}0.0{% endif %}
          agreement_samples: >-
            {% set prev = this.attributes.get('agreement_samples', 0) | int(0) %}
            {% set decision_action = state_attr('sensor.gen24_state_decision', 'action') | default('IDLE') %}
            {% set observed = state_attr('sensor.gen24_state_input', 'observed_action') | default('IDLE') %}
            {% set decision = states('sensor.gen24_state_decision') %}
            {% set map = {'CHARGE':'CHARGING','DISCHARGE':'DISCHARGING','IDLE':'IDLE'} %}
            {% set mapped = map.get(decision_action, decision_action) %}
            {% if decision not in ['unavailable','unknown','none',''] and decision_action != 'BLOCK' and observed not in ['unavailable','unknown','none',''] %}
              {% if mapped == observed %}{{ prev + 1 }}{% else %}{{ prev }}{% endif %}
            {% else %}
              {{ prev }}
            {% endif %}
          agreement_score_pct: >-
            {% set total = this.attributes.get('total_samples', 0) | int(0) %}
            {% set agrees = this.attributes.get('agreement_samples', 0) | int(0) %}
            {% if total > 0 %}{{ (agrees / total * 100) | round(1) }}{% else %}0.0{% endif %}
          last_mismatch: >-
            {% set decision_action = state_attr('sensor.gen24_state_decision', 'action') | default('IDLE') %}
            {% set observed = state_attr('sensor.gen24_state_input', 'observed_action') | default('IDLE') %}
            {% set decision = states('sensor.gen24_state_decision') %}
            {% set map = {'CHARGE':'CHARGING','DISCHARGE':'DISCHARGING','IDLE':'IDLE'} %}
            {% set mapped = map.get(decision_action, decision_action) %}
            {% if decision not in ['unavailable','unknown','none',''] and decision_action != 'BLOCK' and observed not in ['unavailable','unknown','none',''] and mapped != observed %}
              {{ now().isoformat() }}: decision={{ decision_action }} observed={{ observed }}
            {% else %}
              {{ this.attributes.get('last_mismatch', 'none') }}
            {% endif %}
          decision_quality_score: >-
            {% set total = this.attributes.get('total_samples', 0) | int(0) %}
            {% set agrees = this.attributes.get('agreement_samples', 0) | int(0) %}
            {% set rejects = this.attributes.get('reject_samples', 0) | int(0) %}
            {% if total > 0 %}
              {% set agreement_weight = (agrees / total * 70) %}
              {% set reject_weight = ((total - rejects) / total * 30) %}
              {{ (agreement_weight + reject_weight) | round(1) }}
            {% else %}
              0.0
            {% endif %}
          evaluation_note: >-
            Score 0-100. 70% agreement + 30% ej-reject. agreement = vart beslut.action
            (CHARGE/DISCHARGE/IDLE) matchar firmwarens observed_action (CHARGING/DISCHARGING/IDLE).
          # ================================================================
          # Schema 2-filtrerad statistik (firmware 1.3.18+)
          # Raknar bara prov dar sample_schema >= 2.
          # LEGACY_SCHEMA raknas EJ in har.
          # ================================================================
          period_start: >-
            {% set existing = this.attributes.get('period_start', '') %}
            {% set schema = state_attr('sensor.gen24_state_input', 'sample_schema') | default(0) | int %}
            {% set decision = states('sensor.gen24_state_decision') %}
            {% if existing == '' and schema >= 2 and decision not in ['unavailable','unknown','none',''] %}
              {{ now().isoformat() }}
            {% else %}
              {{ existing }}
            {% endif %}
          schema2_samples: >-
            {% set prev = this.attributes.get('schema2_samples', 0) | int(0) %}
            {% set schema = state_attr('sensor.gen24_state_input', 'sample_schema') | default(0) | int %}
            {% set decision = states('sensor.gen24_state_decision') %}
            {% if trigger is defined and trigger.id == 'state' and trigger.from_state is defined and trigger.from_state.state == trigger.to_state.state %}
              {{ prev }}
            {% elif schema >= 2 and decision not in ['unavailable','unknown','none',''] %}
              {{ prev + 1 }}
            {% else %}
              {{ prev }}
            {% endif %}
          schema2_rejects: >-
            {% set prev = this.attributes.get('schema2_rejects', 0) | int(0) %}
            {% set schema = state_attr('sensor.gen24_state_input', 'sample_schema') | default(0) | int %}
            {% set decision = states('sensor.gen24_state_decision') %}
            {% if schema >= 2 and decision == 'DATA_QUALITY_REJECT' %}
              {{ prev + 1 }}
            {% else %}
              {{ prev }}
            {% endif %}
          schema2_reject_ratio_pct: >-
            {% set total = this.attributes.get('schema2_samples', 0) | int(0) %}
            {% set rejects = this.attributes.get('schema2_rejects', 0) | int(0) %}
            {% if total > 0 %}{{ (rejects / total * 100) | round(1) }}{% else %}0.0{% endif %}
          quality_reason_counts: >-
            {% set prev = this.attributes.get('quality_reason_counts', {}) %}
            {% set schema = state_attr('sensor.gen24_state_input', 'sample_schema') | default(0) | int %}
            {% set decision = states('sensor.gen24_state_decision') %}
            {% if schema >= 2 and decision == 'DATA_QUALITY_REJECT' %}
              {% set reason = state_attr('sensor.gen24_state_input', 'quality_reason') | default('UNKNOWN') %}
              {{ dict(prev, **{reason: (prev.get(reason, 0) | int(0)) + 1}) }}
            {% else %}
              {{ prev }}
            {% endif %}
